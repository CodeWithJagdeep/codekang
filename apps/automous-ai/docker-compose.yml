version: "3.9"

# ==========================================
# CODEKANG - COMPLETE INFRASTRUCTURE
# ==========================================
# PostgreSQL + pgvector + Redis + BullMQ Dashboard + Monitoring
# Run: docker-compose up -d

services:
  # ==========================================
  # POSTGRESQL WITH PGVECTOR
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codekang-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codekang
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"

    volumes:
      # Persistent data
      - postgres_data:/var/lib/postgresql/data

      # Auto-run schema on first startup
      - ./src/db/migrations/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

      # Custom PostgreSQL config (optional)
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf

    # Performance tuning
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c max_parallel_maintenance_workers=2

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - codekang-network

  # ==========================================
  # REDIS (FOR BULLMQ)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: codekang-redis
    restart: unless-stopped

    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - codekang-network

  # ==========================================
  # BULLMQ BOARD (Job Queue Dashboard)
  # ==========================================
  bullmq-board:
    image: deadly0/bull-board:latest
    container_name: codekang-bullmq-board
    restart: unless-stopped

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_USE_TLS: "false"
      BULL_PREFIX: "bull"

    ports:
      - "3001:3000"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - codekang-network

  # ==========================================
  # PGADMIN (PostgreSQL GUI - Optional)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: codekang-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@codekang.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - codekang-network

    profiles:
      - tools # Only start with: docker-compose --profile tools up

  # ==========================================
  # REDIS COMMANDER (Redis GUI - Optional)
  # ==========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: codekang-redis-commander
    restart: unless-stopped

    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: admin
      HTTP_PASSWORD: admin

    ports:
      - "8081:8081"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - codekang-network

    profiles:
      - tools # Only start with: docker-compose --profile tools up

  # ==========================================
  # PROMETHEUS (Metrics - Optional)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: codekang-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

    ports:
      - "9090:9090"

    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

    networks:
      - codekang-network

    profiles:
      - monitoring

  # ==========================================
  # GRAFANA (Dashboards - Optional)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: codekang-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: redis-datasource

    ports:
      - "3002:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources

    depends_on:
      - prometheus

    networks:
      - codekang-network

    profiles:
      - monitoring

  # ==========================================
  # NGINX (Reverse Proxy - Optional)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: codekang-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl

    depends_on:
      - postgres
      - redis

    networks:
      - codekang-network

    profiles:
      - production

# ==========================================
# VOLUMES (Persistent Data)
# ==========================================
volumes:
  postgres_data:
    driver: local
    name: codekang-postgres-data

  redis_data:
    driver: local
    name: codekang-redis-data

  pgadmin_data:
    driver: local
    name: codekang-pgadmin-data

  prometheus_data:
    driver: local
    name: codekang-prometheus-data

  grafana_data:
    driver: local
    name: codekang-grafana-data

# ==========================================
# NETWORKS
# ==========================================
networks:
  codekang-network:
    driver: bridge
    name: codekang-network
