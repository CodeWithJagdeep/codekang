# ============================================================================
# CODEKANG PLATFORM - UNIFIED DOCKER COMPOSE
# ============================================================================
# Usage:
#   Production:  docker-compose up -d
#   Development: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#   With tools:  docker-compose --profile tools up
#   Everything:  docker-compose --profile '*' up
# ============================================================================

services:
  # ⚙️ INFRASTRUCTURE
  # ──────────────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: codekang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-codekang_platform}
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=en_US.UTF-8'
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codekang

  postgres-backup:
    build:
      context: ./docker/postgres-backup
    container_name: codekang-postgres-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-codekang_platform}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codekang

  redis:
    image: redis:7-alpine
    container_name: codekang-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - codekang
    depends_on:
      - postgres

  # 🎯 MICROSERVICES
  # ──────────────────────────────────────────────────────────────────────

  auth:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    container_name: codekang-auth
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-codekang_platform}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      AUTH_TCP_PORT: ${AUTH_TCP_PORT:-3001}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY}
      ZOHO_SMTP_HOST: ${ZOHO_SMTP_HOST:-smtp.zoho.com}
      ZOHO_SMTP_PORT: ${ZOHO_SMTP_PORT:-465}
      ZOHO_SMTP_USER: ${ZOHO_SMTP_USER}
      ZOHO_SMTP_PASS: ${ZOHO_SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM:-CodeKang <noreply@codekang.com>}
    ports:
      - '${AUTH_TCP_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codekang
    healthcheck:
      test:
        ['CMD', 'node', '-e', "require('net').createConnection({port:3001}).on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ai-agent:
    build:
      context: .
      dockerfile: docker/ai-agent/Dockerfile
    container_name: codekang-ai-agent
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-codekang_platform}
      AI_AGENT_TCP_PORT: ${AI_AGENT_TCP_PORT:-3002}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      AUTH_SERVICE_HOST: auth
      AUTH_TCP_PORT: ${AUTH_TCP_PORT:-3001}
      REDIS_URL: redis://redis:6379
    ports:
      - '${AI_AGENT_TCP_PORT:-3002}:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - codekang
    healthcheck:
      test:
        ['CMD', 'node', '-e', "require('net').createConnection({port:3002}).on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  repos:
    build:
      context: .
      dockerfile: docker/repos/Dockerfile
    container_name: codekang-repos
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-codekang_platform}
      REPOS_TCP_PORT: ${REPOS_TCP_PORT:-3003}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      AUTH_SERVICE_HOST: auth
      AUTH_TCP_PORT: ${AUTH_TCP_PORT:-3001}
      REDIS_URL: redis://redis:6379
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RAZORPAY_PLAN_STARTER_MONTHLY_ID: ${RAZORPAY_PLAN_STARTER_MONTHLY_ID}
      RAZORPAY_PLAN_STARTER_ANNUAL_ID: ${RAZORPAY_PLAN_STARTER_ANNUAL_ID}
      RAZORPAY_PLAN_TEAM_MONTHLY_ID: ${RAZORPAY_PLAN_TEAM_MONTHLY_ID}
      RAZORPAY_PLAN_TEAM_ANNUAL_ID: ${RAZORPAY_PLAN_TEAM_ANNUAL_ID}
    ports:
      - '${REPOS_TCP_PORT:-3003}:3003'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - codekang
    healthcheck:
      test:
        ['CMD', 'node', '-e', "require('net').createConnection({port:3003}).on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    container_name: codekang-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      AUTH_SERVICE_HOST: auth
      AUTH_TCP_PORT: ${AUTH_TCP_PORT:-3001}
      AI_AGENT_SERVICE_HOST: ai-agent
      AI_AGENT_TCP_PORT: ${AI_AGENT_TCP_PORT:-3002}
      REPOS_SERVICE_HOST: repos
      REPOS_TCP_PORT: ${REPOS_TCP_PORT:-3003}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: redis://redis:6379
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET}
      JIRA_CLIENT_ID: ${JIRA_CLIENT_ID}
      JIRA_CLIENT_SECRET: ${JIRA_CLIENT_SECRET}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET}
      BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID}
      BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET}
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    depends_on:
      auth:
        condition: service_healthy
      ai-agent:
        condition: service_healthy
      repos:
        condition: service_healthy
    networks:
      - codekang
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 🤖 AUTONOMOUS AI AGENT
  # ──────────────────────────────────────────────────────────────────────

  autonomous:
    build:
      context: ./apps/automous-ai
      dockerfile: ../../docker/autonomous/Dockerfile
    container_name: codekang-autonomous
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${AUTONOMOUS_PORT:-4000}
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-codekang_platform}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL_CLASSIFIER: ${ANTHROPIC_MODEL_CLASSIFIER:-claude-haiku-4-5-20251001}
      ANTHROPIC_MODEL_AGENT: ${ANTHROPIC_MODEL_AGENT:-claude-sonnet-4-6}
      # GitHub
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_APP_PRIVATE_KEY_PATH: /app/github-app-private-key.pem
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      # Worker tuning
      INDEX_WORKER_CONCURRENCY: ${INDEX_WORKER_CONCURRENCY:-2}
      FIX_WORKER_CONCURRENCY: ${FIX_WORKER_CONCURRENCY:-1}
      JOB_ATTEMPTS: ${JOB_ATTEMPTS:-3}
      JOB_BACKOFF_DELAY: ${JOB_BACKOFF_DELAY:-5000}
      INDEX_JOB_TIMEOUT: ${INDEX_JOB_TIMEOUT:-300000}
      FIX_JOB_TIMEOUT: ${FIX_JOB_TIMEOUT:-600000}
      # Vector / embeddings
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-anthropic}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      # Gateway
      GATEWAY_URL: http://gateway:3000
      GATEWAY_INTERNAL_URL: http://gateway:3000
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://autonomous:4000/webhook}
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - '${AUTONOMOUS_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codekang
    volumes:
      - ./github-app-private-key.pem:/app/github-app-private-key.pem:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 🛠️ DEVELOPMENT TOOLS (--profile tools)
  # ──────────────────────────────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: codekang-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@codekang.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codekang
    profiles:
      - tools

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: codekang-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: ${REDIS_ADMIN_USER:-admin}
      HTTP_PASSWORD: ${REDIS_ADMIN_PASSWORD:-admin}
    ports:
      - '${REDIS_COMMANDER_PORT:-8081}:8081'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - codekang
    profiles:
      - tools

  bull-board:
    image: deadly0/bull-board:latest
    container_name: codekang-bull-board
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      REDIS_DB: 0
      REDIS_USE_TLS: 'false'
      BULL_PREFIX: 'bull'
    ports:
      - '${BULL_BOARD_PORT:-3099}:3000'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - codekang
    profiles:
      - tools

  # 📊 MONITORING (--profile monitoring)
  # ──────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: codekang-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - prometheus_data:/prometheus
    networks:
      - codekang
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: codekang-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: redis-datasource
    ports:
      - '${GRAFANA_PORT:-3002}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - codekang
    profiles:
      - monitoring

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
    name: codekang-postgres-data
  postgres_backups:
    driver: local
    name: codekang-postgres-backups
  redis_data:
    driver: local
    name: codekang-redis-data
  pgadmin_data:
    driver: local
    name: codekang-pgadmin-data
  prometheus_data:
    driver: local
    name: codekang-prometheus-data
  grafana_data:
    driver: local
    name: codekang-grafana-data

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  codekang:
    driver: bridge
    name: codekang-network
