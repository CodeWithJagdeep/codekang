apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: codekang
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: codekang/auth:latest
          ports:
            - containerPort: 3011
              name: http
            - containerPort: 3001
              name: tcp
          envFrom:
            - configMapRef:
                name: codekang-config
            - secretRef:
                name: codekang-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          readinessProbe:
            httpGet:
              path: /health
              port: 3011
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3011
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
