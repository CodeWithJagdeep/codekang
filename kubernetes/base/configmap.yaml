apiVersion: v1
kind: ConfigMap
metadata:
  name: codekang-config
  namespace: codekang
data:
  NODE_ENV: "production"
  POSTGRES_DB: "codekang_platform"
  POSTGRES_PORT: "5432"
  POSTGRES_HOST: "postgres"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://redis:6379"
  GATEWAY_PORT: "3000"
  AUTH_HTTP_PORT: "3011"
  AUTH_TCP_PORT: "3001"
  AI_AGENT_TCP_PORT: "3002"
  REPOS_TCP_PORT: "3003"
  AUTONOMOUS_PORT: "4000"
  AUTH_SERVICE_HOST: "auth"
  AI_AGENT_SERVICE_HOST: "ai-agent"
  REPOS_SERVICE_HOST: "repos"
  ANTHROPIC_MODEL: "claude-sonnet-4-6"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  FRONTEND_URL: "http://frontend:3010"
  GATEWAY_URL: "http://gateway:3000"
