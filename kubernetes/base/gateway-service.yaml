apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: codekang
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-external
  namespace: codekang
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: LoadBalancer
