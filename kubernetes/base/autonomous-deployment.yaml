apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous
  namespace: codekang
  labels:
    app: autonomous
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autonomous
  template:
    metadata:
      labels:
        app: autonomous
    spec:
      containers:
        - name: autonomous
          image: codekang/autonomous:latest
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: codekang-config
            - secretRef:
                name: codekang-secrets
          env:
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
