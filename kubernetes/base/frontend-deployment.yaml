apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: codekang
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: codekang/frontend:latest
          ports:
            - containerPort: 3010
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "http://gateway:3000/api/v1"
            - name: NEXT_PUBLIC_AUTH_URL
              value: "http://auth:3011"
          readinessProbe:
            httpGet:
              path: /
              port: 3010
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3010
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: codekang
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3010
      targetPort: 3010
  type: ClusterIP
