apiVersion: apps/v1
kind: Deployment
metadata:
  name: repos
  namespace: codekang
  labels:
    app: repos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repos
  template:
    metadata:
      labels:
        app: repos
    spec:
      containers:
        - name: repos
          image: codekang/repos:latest
          ports:
            - containerPort: 3003
              name: tcp
          envFrom:
            - configMapRef:
                name: codekang-config
            - secretRef:
                name: codekang-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          readinessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
