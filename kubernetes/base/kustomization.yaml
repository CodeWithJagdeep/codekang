apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: codekang-base
  namespace: default

commonLabels:
  app: codekang-platform
  version: v1

commonAnnotations:
  managed-by: kustomize

namespace: codekang

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  # Storage
  - postgres-pvc.yaml
  - redis-pvc.yaml
  # Infrastructure deployments
  - postgres-deployment.yaml
  - redis-deployment.yaml
  # Microservice deployments
  - auth-deployment.yaml
  - ai-agent-deployment.yaml
  - repos-deployment.yaml
  - gateway-deployment.yaml
  - autonomous-deployment.yaml
  # Services
  - postgres-service.yaml
  - redis-service.yaml
  - auth-service.yaml
  - ai-agent-service.yaml
  - repos-service.yaml
  - gateway-service.yaml
  - autonomous-service.yaml
  # Ingress
  - ingress.yaml

images:
  - name: codekang/gateway
    newTag: latest
  - name: codekang/auth
    newTag: latest
  - name: codekang/ai-agent
    newTag: latest
  - name: codekang/repos
    newTag: latest
  - name: codekang/autonomous
    newTag: latest

replicas:
  - name: gateway
    count: 1
  - name: auth
    count: 1
  - name: ai-agent
    count: 1
  - name: repos
    count: 1
  - name: autonomous
    count: 1
