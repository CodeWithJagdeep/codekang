apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: codekang-base
  namespace: default

# Common labels for all resources
commonLabels:
  app: codekang-platform
  version: v1

# Common annotations
commonAnnotations:
  managed-by: kustomize
  environment: production

# Namespace
namespace: codekang

# Base resources
resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres-pvc.yaml
  - redis-pvc.yaml
  - postgres-deployment.yaml
  - redis-deployment.yaml
  - gateway-deployment.yaml
  - auth-deployment.yaml
  - ai-agent-deployment.yaml
  - repos-deployment.yaml
  - autonomous-deployment.yaml
  - frontend-deployment.yaml
  - gateway-service.yaml
  - auth-service.yaml
  - postgres-service.yaml
  - redis-service.yaml

# Images
images:
  - name: codekang/gateway
    newTag: latest
  - name: codekang/auth
    newTag: latest
  - name: codekang/ai-agent
    newTag: latest
  - name: codekang/repos
    newTag: latest
  - name: codekang/autonomous
    newTag: latest
  - name: codekang/frontend
    newTag: latest
  - name: postgres
    newTag: 16-alpine
  - name: redis
    newTag: 7-alpine

# Replicas (will be overridden in overlays)
replicas:
  - name: gateway
    count: 1
  - name: auth
    count: 1
  - name: ai-agent
    count: 1
  - name: repos
    count: 1
  - name: autonomous
    count: 1
  - name: frontend
    count: 1

# Patches
patches:
  - target:
      kind: Deployment
      labelSelector: "app=codekang-platform"
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
