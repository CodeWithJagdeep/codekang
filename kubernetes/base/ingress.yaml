apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: codekang
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket support for Socket.IO
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  rules:
    - host: api.codekang.com   # change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3000
    - host: webhook.codekang.com   # separate host for autonomous AI webhooks
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: autonomous
                port:
                  number: 4000
  # Uncomment after adding cert-manager:
  # tls:
  #   - hosts:
  #       - api.codekang.com
  #       - webhook.codekang.com
  #     secretName: codekang-tls
